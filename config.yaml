# Base configuration. Put secrets in config.local.yaml (ignored by git).
strava:
  client_id: ""
  client_secret: ""
  refresh_token: ""

sync:
  lookback_years: 5
  start_date: "2010-01-01" # optional; overrides lookback_years when set
  recent_days: 7
  resume_backfill: true
  per_page: 200
  prune_deleted: false

rate_limits:
  overall_15_min: 200
  overall_daily: 2000
  read_15_min: 100
  read_daily: 1000
  safety_buffer: 2
  min_interval_seconds: 10

activities:
  types:
    - Ride
  # Distance thresholds (in configured units) for color intensity levels 1-8
  # Distances below level_1 get the darkest color; above level_8 get the brightest
  distance_levels:
    Ride:
      level_1: 10
      level_2: 20
      level_3: 30
      level_4: 40
      level_5: 50
      level_6: 60
      level_7: 80
      level_8: 100
    Run:
      level_1: 2
      level_2: 4
      level_3: 6
      level_4: 8
      level_5: 10
      level_6: 15
      level_7: 21
      level_8: 42
    WeightTraining:
      level_1: 0
      level_2: 0
      level_3: 0
      level_4: 0
      level_5: 0
      level_6: 0
      level_7: 0
      level_8: 0
  # Weekly distance thresholds for the weekly total row
  weekly_distance_levels:
    Ride:
      level_1: 25
      level_2: 40
      level_3: 60
      level_4: 80
      level_5: 100
      level_6: 130
      level_7: 175
      level_8: 225
    Run:
      level_1: 15
      level_2: 25
      level_3: 40
      level_4: 55
      level_5: 70
      level_6: 90
      level_7: 120
      level_8: 150
  type_aliases:
    TrailRun: Run
    VirtualRun: Run
    Treadmill: Run
    Ride: Ride
    VirtualRide: Ride
    EBikeRide: Ride
    GravelRide: Ride
    MountainBikeRide: Ride
    Handcycle: Ride
    Velomobile: Ride
    IndoorRide: Ride
    StrengthTraining: WeightTraining
    WeightTraining: WeightTraining

units:
  distance: "km"   # "mi" or "km"
  elevation: "m"  # "ft" or "m"
